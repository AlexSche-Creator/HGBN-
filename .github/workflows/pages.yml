name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/headache-tracking-app-lhn0pk
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один активный деплой за раз; новые пуши отменяют предыдущий прогон.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Включить GitHub Pages автоматически (источник — GitHub Actions),
          # если он ещё не включён в настройках репозитория.
          enablement: true

      - name: Upload web/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
